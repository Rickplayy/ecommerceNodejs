services:
  - type: web
    name: ecommerce-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --build-from-source=sqlite3 && npx puppeteer browsers install chrome
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/backend/.cache/puppeteer